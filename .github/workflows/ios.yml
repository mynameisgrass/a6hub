name: Build iOS IPA

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build iOS App
        working-directory: ./ios/App
        run: |
          # Build without code signing to get the .app file
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Export Unsigned IPA for TrollStore
        working-directory: ./ios/App
        run: |
          mkdir -p Payload
          # Copy the .app from DerivedData
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          # TrollStore requires a proper zip
          zip -qr A6Hub-iOS.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: A6Hub-iOS-App
          path: ios/App/A6Hub-iOS.ipa
